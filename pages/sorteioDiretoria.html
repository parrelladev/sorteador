<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteador Institucional</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="shortcut icon" href="../img/favicon-32x32.png" />
</head>

<body>
    <div class="container mt-5">
        <a href="../index.html"><img src="../img/REDE-GAZETA_negativo.png" alt="Imagem de Recarregar" style="cursor: pointer;"></a>
        <div id="main-container" class="">
            <h2 class="text-style">Sorteador Institucional 🍀</h2>

            <!-- Número de Ingressos a Serem Sorteados -->
            <div class="form-group">
                <label for="numIngressos">Número de Ingressos por Diretoria:</label>
                <input type="number" id="numIngressos" class="form-control" placeholder="Digite o número de ingressos"
                    required>
            </div>

            <!-- Upload de Arquivo -->
            <div class="form-group">
                <label for="fileUpload">Selecione um arquivo com a lista (.xlsx):</label>
                <input type="file" id="fileUpload" class="form-control-file" accept=".xlsx" required>
            </div>

            <!-- Botão de Processamento -->
            <button class="btn btn-primary" onclick="processFile()">Sortear 🎲</button>

            <button class="btn btn-second" onclick="goToHome()">Voltar <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-return-left" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M14.5 1.5a.5.5 0 0 1 .5.5v4.8a2.5 2.5 0 0 1-2.5 2.5H2.707l3.347 3.346a.5.5 0 0 1-.708.708l-4.2-4.2a.5.5 0 0 1 0-.708l4-4a.5.5 0 1 1 .708.708L2.707 8.3H12.5A1.5 1.5 0 0 0 14 6.8V2a.5.5 0 0 1 .5-.5"/>
              </svg></button>
        </div>

        <!-- Exibição de Resultados ou Erros -->
        <div id="result" class="mt-4"></div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>
        <script src="../js/fileReader.js"></script>
        <script src="../js/validation.js"></script>
        <script src="../js/grouping.js"></script>
        <script src="../js/sorting.js"></script>
        <script src="../js/ui.js"></script>
</body>

</html>
